      - name: Native scientific and validation gates
        working-directory: _src
        run: ./scripts/test_host.sh
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android CLI and API 37.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          ANDROID_BIN="$(command -v android || true)"
          [ -n "$ANDROID_BIN" ] || ANDROID_BIN="$(find "$HOME" -type f -name android -perm -u+x 2>/dev/null | head -1 || true)"
          test -n "$ANDROID_BIN"
          "$ANDROID_BIN" --sdk="$ANDROID_SDK_ROOT" sdk install --canary platforms/android-37.2 build-tools/36.0.0 ndk/28.2.13676358
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.2/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Patch project for AGP 9 and API 37.2
        working-directory: _src
        run: |
          set -euo pipefail
          sed -i '/id("org.jetbrains.kotlin.android")/d' build.gradle.kts app/build.gradle.kts
          python3 - <<'PY2'
          from pathlib import Path
          p=Path('app/build.gradle.kts'); s=p.read_text()
          s=s.replace('    compileSdk = 37\n','    compileSdk {\n        version = release(37) {\n            minorApiLevel = 2\n        }\n    }\n')
          s=s.replace('    kotlinOptions {\n        jvmTarget = "17"\n    }\n','')
          p.write_text(s)
          PY2
          ! grep -R 'org.jetbrains.kotlin.android' build.gradle.kts app/build.gradle.kts
          ! grep -n 'kotlinOptions' app/build.gradle.kts
      - name: Gradle configuration check
        working-directory: _src
        run: gradle --no-daemon help --stacktrace
      - name: Build debug APK
        working-directory: _src
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Package APK and source
        working-directory: _src
        run: |
          set -euo pipefail
          ./scripts/package_release.sh
          cp dist/WholeBrainMobile-debug.apk dist/WholeBrainMobile-0.2.0-DeviceValidation-debug.apk
          sha256sum dist/WholeBrainMobile-0.2.0-DeviceValidation-debug.apk > dist/WholeBrainMobile-0.2.0-DeviceValidation-debug.apk.sha256
          zip -qr dist/WholeBrainMobile_SOURCE_v0.2.zip . -x 'host-tests/build/*' 'app/build/*' 'dist/*' '.git/*'
          cp /tmp/v2.patch dist/device-validation-v2.patch
      - name: Verify APK
        working-directory: _src
        run: |
          test -f dist/WholeBrainMobile-0.2.0-DeviceValidation-debug.apk
          ls -lh dist/WholeBrainMobile-0.2.0-DeviceValidation-debug.apk
          sha256sum dist/WholeBrainMobile-0.2.0-DeviceValidation-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: wholebrain-mobile-device-validation-v2
          path: |
            _src/dist/WholeBrainMobile-0.2.0-DeviceValidation-debug.apk
            _src/dist/WholeBrainMobile-0.2.0-DeviceValidation-debug.apk.sha256
            _src/dist/WholeBrainMobile_SOURCE_v0.2.zip
            _src/dist/device-validation-v2.patch
          if-no-files-found: error
