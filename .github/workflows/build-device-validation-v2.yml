name: Build WholeBrain Mobile Device Validation v2

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/build-device-validation-v2.yml' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack v0.1 source
        run: |
          set -euo pipefail
          rm -rf _handoff _src
          mkdir -p _handoff _src
          unzip -q WholeBrainMobile_HANDOFF_v0.1.zip -d _handoff
          INNER=$(find _handoff -type f -name 'WholeBrainMobile_SOURCE_v0.1.zip' | head -1)
          test -n "$INNER"
          unzip -q "$INNER" -d _src
