name: Build WholeBrain Mobile v1.2.2 S25 Responsive

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'WholeBrainMobile_SOURCE_v1.2.2.zip'
      - '.github/workflows/build-wholebrain-v1-2-2.yml'

permissions:
  contents: read

concurrency:
  group: wholebrain-v1-2-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Resolve and unpack v1.2.2 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _src _unpack
          mkdir -p _src _unpack
          test -f WholeBrainMobile_SOURCE_v1.2.2.zip
          unzip -q WholeBrainMobile_SOURCE_v1.2.2.zip -d _unpack

          PROJECT_BUILD="$(find _unpack -type f -path '*/app/build.gradle.kts' -print -quit)"
          test -n "$PROJECT_BUILD"
          PROJECT_ROOT="${PROJECT_BUILD%/app/build.gradle.kts}"
          cp -a "$PROJECT_ROOT"/. _src/
          rm -rf _unpack

          rm -rf _src/host-tests/build _src/app/.cxx _src/app/build _src/build _src/.gradle _src/dist
          test -z "$(find _src -name CMakeCache.txt -print -quit)"
          chmod +x _src/scripts/test_host.sh _src/scripts/package_release.sh

          grep -q 'versionName = "1.2.2"' _src/app/build.gradle.kts
          grep -q 'versionCode = 18' _src/app/build.gradle.kts
          grep -q 'minorApiLevel = 2' _src/app/build.gradle.kts
          grep -q 'ndkVersion = "28.2.13676358"' _src/app/build.gradle.kts
          grep -q 'targetSdk = 36' _src/app/build.gradle.kts

          BC=_src/app/src/main/java/com/eyalshemuel/wholebrainmobile/brain/BrainController.kt
          MAIL=_src/app/src/main/java/com/eyalshemuel/wholebrainmobile/brain/LatestLiveInputMailbox.kt
          PACE=_src/app/src/main/java/com/eyalshemuel/wholebrainmobile/brain/BrainPacingPolicy.kt
          test -f "$MAIL"
          test -f "$PACE"
          grep -q 'runBrainLoop' "$BC"
          grep -q 'UI_STATS_INTERVAL_NS = 150_000_000L' "$BC"
          grep -q 'Process.THREAD_PRIORITY_DEFAULT + 2' "$BC"
          grep -q 'BrainPacingPolicy.cooldownNs' "$BC"
          grep -q 'liveInputs.offerVision' "$BC"
          grep -q 'liveInputs.offerAudio' "$BC"
          ! grep -qE 'scheduleAtFixedRate|scheduleWithFixedDelay|ArrayBlockingQueue|DiscardOldestPolicy|postLiveInput' "$BC"
          grep -q 'mode_ == RunMode::Learn || mode_ == RunMode::Act' _src/app/src/main/cpp/wholebrain_engine.cpp

          ! grep -RInE 'android\.speech\.tts|TTS_SERVICE|synthesizeToFile' \
            _src/app/src/main/java _src/app/src/main/AndroidManifest.xml
          ! grep -q 'android.permission.INTERNET' _src/app/src/main/AndroidManifest.xml

          (
            cd _src
            zip -qr "$GITHUB_WORKSPACE/WholeBrainMobile_SOURCE_v1.2.2-CI.zip" . \
              -x 'host-tests/build/*' 'host-tests/kotlin/*.jar' 'app/.cxx/*' 'app/build/*' 'build/*' '.gradle/*' 'dist/*'
          )
          sha256sum WholeBrainMobile_SOURCE_v1.2.2-CI.zip > WholeBrainMobile_SOURCE_v1.2.2-CI.zip.sha256

      - name: Native v1.2.2 scientific gates
        working-directory: _src
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 20m \
            ./scripts/test_host.sh 2>&1 | tee host-tests/V1_2_2_CI_TEST_OUTPUT.txt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK from runner
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      - name: Install Android API 37.2 build-tools and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'

          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          ANDROID_BIN="$(command -v android || true)"
          if [ -z "$ANDROID_BIN" ]; then
            ANDROID_BIN="$(find "$HOME" -type f -name android -perm -u+x 2>/dev/null | head -1 || true)"
          fi
          test -n "$ANDROID_BIN"
          "$ANDROID_BIN" --sdk="$ANDROID_SDK_ROOT" sdk install --canary \
            platforms/android-37.2 build-tools/36.0.0 ndk/28.2.13676358
          test -f "$ANDROID_SDK_ROOT/platforms/android-37.2/android.jar"
          test -d "$ANDROID_SDK_ROOT/ndk/28.2.13676358"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Gradle configuration check
        working-directory: _src
        run: gradle --no-daemon help --stacktrace

      - name: Android/JVM responsiveness unit tests
        working-directory: _src
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: _src
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Package APK
        working-directory: _src
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/package_release.sh

      - name: Verify APK
        working-directory: _src
        shell: bash
        run: |
          set -euo pipefail
          APK=dist/WholeBrainMobile-1.2.2-debug.apk
          test -f "$APK"
          test -f "$APK.sha256"
          sha256sum -c "$APK.sha256"
          unzip -tq "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libwholebrain.so'
          ls -lh "$APK"
          sha256sum "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: wholebrain-mobile-1.2.2-s25-responsive
          path: |
            _src/dist/WholeBrainMobile-1.2.2-debug.apk
            _src/dist/WholeBrainMobile-1.2.2-debug.apk.sha256
            _src/dist/WholeBrainMobile-debug.apk
            _src/dist/WholeBrainMobile-debug.apk.sha256
            WholeBrainMobile_SOURCE_v1.2.2-CI.zip
            WholeBrainMobile_SOURCE_v1.2.2-CI.zip.sha256
            _src/host-tests/V1_2_2_CI_TEST_OUTPUT.txt
            _src/V1_2_2_S25_RESPONSIVENESS_REPORT_HE.md
          if-no-files-found: error
          retention-days: 30
