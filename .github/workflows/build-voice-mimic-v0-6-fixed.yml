name: Build WholeBrain Mobile Authorized Voice Mimic v0.6 PURE-KOTLIN FIXED

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'WholeBrainMobile_SOURCE_v0.6.0.zip'
      - 'WholeBrainMobile_HANDOFF_v0.6.0.zip'
      - '.github/workflows/build-voice-mimic-v0-6-fixed.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and unpack exact v0.6 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _handoff _src
          mkdir -p _handoff _src

          if [ -f WholeBrainMobile_SOURCE_v0.6.0.zip ]; then
            SOURCE_ZIP="$PWD/WholeBrainMobile_SOURCE_v0.6.0.zip"
          elif [ -f WholeBrainMobile_HANDOFF_v0.6.0.zip ]; then
            unzip -q WholeBrainMobile_HANDOFF_v0.6.0.zip -d _handoff
            SOURCE_ZIP="$(find "$PWD/_handoff" -type f -name 'WholeBrainMobile_SOURCE_v0.6.0.zip' | head -1)"
            test -n "$SOURCE_ZIP"
          else
            echo "ERROR: neither WholeBrainMobile_SOURCE_v0.6.0.zip nor WholeBrainMobile_HANDOFF_v0.6.0.zip exists"
            exit 1
          fi

          echo "Using source: $SOURCE_ZIP"
          unzip -q "$SOURCE_ZIP" -d _src

          test -x _src/scripts/test_host.sh
          grep -q 'versionName = "0.6.0"' _src/app/build.gradle.kts
          grep -q 'versionCode = 9' _src/app/build.gradle.kts

          # v0.6 source uses the verified pure-Kotlin authorized mimic path.
          test -f _src/app/src/main/java/com/eyalshemuel/wholebrainmobile/output/AuthorizedVoiceMimic.kt
          test -f _src/app/src/main/java/com/eyalshemuel/wholebrainmobile/output/VoiceMimicDsp.kt
          test -f _src/host-tests/VoiceMimicDspTest.kt
          test -f _src/V0_6_AUTHORIZED_VOICE_MIMIC_REPORT_HE.md

          # Offline/privacy gates.
          ! grep -q 'android.permission.INTERNET' _src/app/src/main/AndroidManifest.xml
          grep -q 'wholebrain-voice-mimic.xml' _src/app/src/main/res/xml/backup_rules.xml
          grep -q 'wholebrain-voice-mimic.xml' _src/app/src/main/res/xml/data_extraction_rules.xml

          cp "$SOURCE_ZIP" WholeBrainMobile_SOURCE_v0.6.0-CI.zip
          sha256sum WholeBrainMobile_SOURCE_v0.6.0-CI.zip > WholeBrainMobile_SOURCE_v0.6.0-CI.zip.sha256

      - name: Native scientific sensory learning and voice gates
        working-directory: _src
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/test_host.sh | tee host-tests/V0_6_CI_TEST_OUTPUT.txt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android CLI and API 37.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash

          ANDROID_BIN="$(command -v android || true)"
          if [ -z "$ANDROID_BIN" ]; then
            ANDROID_BIN="$(find "$HOME" -type f -name android -perm -u+x 2>/dev/null | head -1 || true)"
          fi

          test -n "$ANDROID_BIN"
          "$ANDROID_BIN" --version
          "$ANDROID_BIN" --sdk="$ANDROID_SDK_ROOT" sdk install --canary \
            platforms/android-37.2 \
            build-tools/36.0.0 \
            ndk/28.2.13676358

          test -f "$ANDROID_SDK_ROOT/platforms/android-37.2/android.jar"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Gradle configuration check
        working-directory: _src
        run: gradle --no-daemon help --stacktrace

      - name: Build debug APK
        working-directory: _src
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Package APK
        working-directory: _src
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/package_release.sh
          ./scripts/package_release.sh

      - name: Verify APK
        working-directory: _src
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/WholeBrainMobile-0.6.0-AuthorizedVoiceMimic-debug.apk
          test -f dist/WholeBrainMobile-0.6.0-AuthorizedVoiceMimic-debug.apk.sha256
          sha256sum -c dist/WholeBrainMobile-0.6.0-AuthorizedVoiceMimic-debug.apk.sha256
          ls -lh dist/WholeBrainMobile-0.6.0-AuthorizedVoiceMimic-debug.apk
          sha256sum dist/WholeBrainMobile-0.6.0-AuthorizedVoiceMimic-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wholebrain-mobile-0.6.0-authorized-voice-mimic-pure-kotlin-fixed
          path: |
            _src/dist/WholeBrainMobile-0.6.0-AuthorizedVoiceMimic-debug.apk
            _src/dist/WholeBrainMobile-0.6.0-AuthorizedVoiceMimic-debug.apk.sha256
            _src/dist/WholeBrainMobile-debug.apk
            _src/dist/WholeBrainMobile-debug.apk.sha256
            WholeBrainMobile_SOURCE_v0.6.0-CI.zip
            WholeBrainMobile_SOURCE_v0.6.0-CI.zip.sha256
            _src/V0_6_AUTHORIZED_VOICE_MIMIC_REPORT_HE.md
            _src/host-tests/V0_6_CI_TEST_OUTPUT.txt
          if-no-files-found: error
