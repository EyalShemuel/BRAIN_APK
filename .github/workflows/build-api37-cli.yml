name: Build WholeBrain Mobile APK API37 CLI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'WholeBrainMobile_HANDOFF_v0.1.zip'
      - '.github/workflows/build-api37-cli.yml'

jobs:
  host-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source
        run: |
          set -euo pipefail
          rm -rf _handoff _src
          mkdir -p _handoff _src
          unzip -q WholeBrainMobile_HANDOFF_v0.1.zip -d _handoff
          INNER=$(find _handoff -type f -name 'WholeBrainMobile_SOURCE_v0.1.zip' | head -1)
          test -n "$INNER"
          unzip -q "$INNER" -d _src
          test -x _src/scripts/test_host.sh

      - name: Native scientific gates
        working-directory: _src
        run: ./scripts/test_host.sh

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source
        run: |
          set -euo pipefail
          rm -rf _handoff _src
          mkdir -p _handoff _src
          unzip -q WholeBrainMobile_HANDOFF_v0.1.zip -d _handoff
          INNER=$(find _handoff -type f -name 'WholeBrainMobile_SOURCE_v0.1.zip' | head -1)
          test -n "$INNER"
          unzip -q "$INNER" -d _src
          test -f _src/settings.gradle.kts
          test -f _src/build.gradle.kts
          test -f _src/app/build.gradle.kts

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android CLI and API 37.2
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash

          ANDROID_BIN="$(command -v android || true)"
          if [ -z "$ANDROID_BIN" ]; then
            ANDROID_BIN="$(find "$HOME" -type f -name android -perm -u+x 2>/dev/null | head -1 || true)"
          fi

          if [ -z "$ANDROID_BIN" ]; then
            echo "ERROR: Android CLI was not found after installation"
            exit 1
          fi

          echo "Android CLI: $ANDROID_BIN"
          "$ANDROID_BIN" --version

          echo "=== Android 37 packages ==="
          "$ANDROID_BIN" --sdk="$ANDROID_SDK_ROOT" sdk list 'platforms/android-37.*' --all --canary || true

          "$ANDROID_BIN" --sdk="$ANDROID_SDK_ROOT" sdk install --canary \
            platforms/android-37.2 \
            build-tools/36.0.0 \
            ndk/28.2.13676358

          echo "=== Installed platform directories ==="
          find "$ANDROID_SDK_ROOT/platforms" -maxdepth 1 -type d -print | sort

          test -f "$ANDROID_SDK_ROOT/platforms/android-37.2/android.jar"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Patch project for AGP 9 and API 37.2
        working-directory: _src
        shell: bash
        run: |
          set -euo pipefail

          sed -i '/id("org.jetbrains.kotlin.android")/d' build.gradle.kts
          sed -i '/id("org.jetbrains.kotlin.android")/d' app/build.gradle.kts

          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()

          s = s.replace(
              '    compileSdk = 37\n',
              '    compileSdk {\n'
              '        version = release(37) {\n'
              '            minorApiLevel = 2\n'
              '        }\n'
              '    }\n'
          )

          s = s.replace(
              '    kotlinOptions {\n'
              '        jvmTarget = "17"\n'
              '    }\n',
              ''
          )

          p.write_text(s)
          PY

          echo "=== compileSdk block ==="
          grep -n -A6 -B2 'compileSdk' app/build.gradle.kts

          ! grep -R 'org.jetbrains.kotlin.android' build.gradle.kts app/build.gradle.kts
          ! grep -n 'kotlinOptions' app/build.gradle.kts

      - name: Gradle configuration check
        working-directory: _src
        run: gradle --no-daemon help --stacktrace

      - name: Build debug APK
        working-directory: _src
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Package APK
        working-directory: _src
        run: |
          chmod +x scripts/package_release.sh
          ./scripts/package_release.sh

      - name: Verify APK
        working-directory: _src
        run: |
          set -euo pipefail
          test -f dist/WholeBrainMobile-debug.apk
          ls -lh dist/WholeBrainMobile-debug.apk
          sha256sum dist/WholeBrainMobile-debug.apk
          test -f dist/WholeBrainMobile-debug.apk.sha256 || sha256sum dist/WholeBrainMobile-debug.apk > dist/WholeBrainMobile-debug.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: wholebrain-mobile-debug-apk-api37-cli
          path: |
            _src/dist/WholeBrainMobile-debug.apk
            _src/dist/WholeBrainMobile-debug.apk.sha256
          if-no-files-found: error
